<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Desain simpel biar mata gak capek */
        body { background: #121212; color: white; font-family: sans-serif; padding: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; }
        .wajah-tool { display: none; } /* Awalnya semua wajah sembunyi */
        .aktif { display: block; }    /* Cuma yang aktif yang muncul */
    </style>
</head>
<body>
    <h2>Frameless Multi-Portal</h2>
    <form method="POST">
        <select name="tool_type" id="pilihTool" onchange="gantiWajah()">
            <option value="finance">Finance Tool</option>
            <option value="sticker">Sticker Tool</option>
        </select>

        {% include 'tools/finance.html' %}
        {% include 'tools/sticker.html' %}

        <button type="submit" style="background: #0070f3; color: white;">HITUNG</button>
    </form>

    {% if hasil %}
        <div style="background: #333; padding: 10px; margin-top: 20px;">
            <strong>Hasil: {{ hasil }}</strong>
        </div>
    {% endif %}

    <script>
        // Fungsi buat ganti-ganti wajah alat tanpa pindah halaman
        function gantiWajah() {
            var selected = document.getElementById("pilihTool").value;
            // Sembunyiin semua wajah
            document.querySelectorAll('.wajah-tool').forEach(el => el.classList.remove('aktif'));
            // Munculin wajah yang diklik
            document.getElementById("wajah_" + selected).classList.add('aktif');
        }
    </script>
</body>
</html>
